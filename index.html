<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>RAGU EMERGENCY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><span class="pulse-dot"></span><b>RAGU</b>&nbsp;EMERGENCY</div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ta">தமிழ்</button>
    </div>
  </header>

  <section class="sos-wrap">
    <button id="sos" class="sos" aria-label="SOS"><span class="sos-t">SOS</span><small data-i="sosHint"></small></button>
  </section>

  <a id="callBtn" class="btn call" href="tel:9597486117"><span data-i="call"></span><b>9597486117</b></a>
  <button class="btn ghost sms" data-i="sms"></button>

  <section class="card voice" id="voice" data-state="off">
    <div class="row">
      <div>
        <h2 data-i="voiceTitle"></h2>
        <p class="status" id="voiceStatus" aria-live="polite"></p>
      </div>
      <button id="micBtn" class="toggle"></button>
    </div>
    <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="note" data-i="voiceNote"></p>
  </section>

  <section class="card">
    <h2 data-i="capTitle"></h2>
    <h3 data-i="webTitle"></h3><ul id="webList"></ul>
    <h3 data-i="nativeTitle"></h3><ul id="nativeList" class="native"></ul>
    <p class="note" id="bridge"></p>
  </section>

  <button id="installBtn" class="btn ghost" data-i="install" hidden></button>
</main>

<div id="overlay" class="overlay" hidden>
  <p data-i="ovText"></p>
  <div class="ring"><span id="count">5</span></div>
  <button id="cancel" class="btn cancel" data-i="cancel"></button>
</div>

<div id="sent" class="overlay sent" hidden>
  <h2 data-i="sentTitle"></h2>
  <p data-i="sentText"></p>
  <a class="btn call" href="tel:9597486117"><span data-i="call"></span><b>9597486117</b></a>
  <button class="btn ghost sms" data-i="sms"></button>
  <button id="closeSent" class="btn ghost" data-i="close"></button>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
